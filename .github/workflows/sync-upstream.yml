name: Sync upstream release

on:
  schedule:
    - cron: '0 0 * * *'
      timezone: America/Denver
  workflow_dispatch:

concurrency:
  group: upstream-release-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'Tao-Boy/pi-web' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    env:
      UPSTREAM_REPOSITORY: agegr/pi-web
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEFAULT_BRANCH }}
          fetch-depth: 0
          persist-credentials: false

      - name: Merge the latest stable release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api "repos/$UPSTREAM_REPOSITORY/releases/latest" --jq .tag_name)
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::Unexpected upstream release tag. Expected vMAJOR.MINOR.PATCH.'
            exit 1
          fi

          # This tag is created only after the image is published, so failed builds can retry.
          marker="upstream-sync/$tag"
          if git show-ref --verify --quiet "refs/tags/$marker"; then
            echo "Upstream release $tag is already published."
            exit 0
          fi

          git fetch --no-tags "https://github.com/$UPSTREAM_REPOSITORY.git" "refs/tags/$tag"
          upstream_commit=$(git rev-parse 'FETCH_HEAD^{commit}')
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-commit --no-ff "$upstream_commit" || git rev-parse --quiet --verify MERGE_HEAD >/dev/null

          # Keep the fork's workflow definitions when importing upstream source.
          git restore --source=HEAD --staged --worktree -- .github/workflows
          if [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
            git diff --name-only --diff-filter=U
            echo "::error::Merge conflicts while syncing upstream release $tag."
            git merge --abort
            exit 1
          fi

          if git rev-parse --quiet --verify MERGE_HEAD >/dev/null; then
            git commit -m "Merge upstream release $tag"
          fi

          if [[ "$(node -p 'require("./package.json").version')" != "${tag#v}" ]]; then
            echo "::error::Merged package.json version does not match upstream release $tag."
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "marker=$marker"
            echo "revision=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        if: steps.release.outputs.tag != ''

      - uses: docker/setup-buildx-action@v3
        if: steps.release.outputs.tag != ''

      - name: Log in to GitHub Container Registry
        if: steps.release.outputs.tag != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Docker image metadata
        if: steps.release.outputs.tag != ''
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.tag }}
          labels: org.opencontainers.image.revision=${{ steps.release.outputs.revision }}

      - name: Build and publish the merged source
        if: steps.release.outputs.tag != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=upstream-release
          cache-to: type=gha,scope=upstream-release,mode=max

      - name: Push the merge and mark the release published
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MARKER: ${{ steps.release.outputs.marker }}
        run: |
          gh auth setup-git
          git push --atomic origin "HEAD:refs/heads/$DEFAULT_BRANCH" "HEAD:refs/tags/$RELEASE_MARKER"
